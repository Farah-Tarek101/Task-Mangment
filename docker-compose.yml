services:
  mongodb:
    image: mongo:7
    container_name: task-mgmt-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: task-mgmt-api
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/task_management
      NODE_ENV: production
      PORT: 3000
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
